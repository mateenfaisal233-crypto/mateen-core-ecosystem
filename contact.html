<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mateen | Start Building</title>
    <meta name="description" content="Get in touch with Mateen to start engineering your next high-performance web project.">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/606/606204.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">MATEEN<span>.CORE</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
            <a href="contact.html" class="btn btn-primary nav-cta">Hire Me</a>
        </div>
    </nav>

    <main>
        <section class="hero hero-compact">
            <h1>Let's Build Your Infrastructure.</h1>
            <p>Submit your project requirements below to start the engineering process.</p>
        </section>

        <form class="contact-form" action="https://formspree.io/f/mbdbznrd" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label>Project Tier</label>
                <select name="tier">
                    <option>Frontend UI Deployment</option>
                    <option>Python Backend Engine</option>
                    <option>Full-Stack Custom Build</option>
                </select>
            </div>
            <div class="form-group">
                <label>Project Details</label>
                <textarea name="message" rows="5" placeholder="Describe the functionality and scope..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Transmit Requirements</button>
        </form>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2023 MATEEN.CORE. Built with precision and line-by-line hand-coding.</p>
            <div class="social-links">
                <a href="#">LinkedIn</a>
                <a href="#">GitHub</a>
                <a href="#">Twitter</a>
            </div>
        </div>
    </footer>
</body>
</html>
